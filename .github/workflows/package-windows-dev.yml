name: Afflow Windows Development Package

on:
  workflow_dispatch:

concurrency:
  group: afflow-windows-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: afflow-windows-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build unsigned NSIS installer
        run: pnpm package:windows

      - name: Verify Afflow installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem `
            "src-tauri/target/release/bundle/nsis" `
            -Filter "Afflow_*-setup.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Afflow NSIS installer was not produced"
          }
          if ($installer.Length -le 0) {
            throw "Afflow NSIS installer is empty"
          }
          Write-Host "Installer: $($installer.FullName)"
          Write-Host "Bytes: $($installer.Length)"

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: afflow-windows-development-installer
          path: src-tauri/target/release/bundle/nsis/Afflow_*-setup.exe
          if-no-files-found: error
